# Override that swaps MongoDB for atlas-local, which bundles Atlas Search so
# $search works offline. Layer it over the base file:
#   docker compose -f docker-compose.yml -f docker-compose.search.yml up
# (or: make up-search). Run `docker compose down -v` when switching engines so
# the data volume isn't shared between two different server builds.
services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    # atlas-local runs a replica set with a keyfile it generates in /data/configdb
    # on first init. Persist BOTH that dir and /data/db (and keep them off mongo:8's
    # volume), so the keyfile survives container recreation on down/up.
    volumes:
      - mongo-atlas-data:/data/db
      - mongo-atlas-config:/data/configdb
    healthcheck:
      start_period: 40s

volumes:
  mongo-atlas-data:
  mongo-atlas-config:
