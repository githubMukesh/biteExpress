# One-command demo: `docker compose up` starts MongoDB, seeds data, starts the API.
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  seed:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: biteexpress
      TENANT_ID: biteexpress
    command: ['node', 'dist/seed/run.js']
    restart: 'no'

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: biteexpress
      TENANT_ID: biteexpress
      LOG_LEVEL: info

volumes:
  mongo-data:
