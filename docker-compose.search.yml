# Override that swaps MongoDB for atlas-local, which bundles Atlas Search so
# $search works offline. Layer it over the base file:
#   docker compose -f docker-compose.yml -f docker-compose.search.yml up --build
# (or: make mongo-atlas).
#
# Anonymous volumes (no named source) give atlas-local a FRESH data dir on every
# container creation. atlas-local initializes its replica set using the container
# hostname and generates its keyfile on a clean /data/db — persisting those across
# recreation breaks it (stale rs hostname / corrupt keyfile). The seed re-runs on
# each `up`, so a fresh start loses nothing and always initializes cleanly.
services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    volumes:
      - /data/db
      - /data/configdb
    healthcheck:
      start_period: 40s

  api:
    environment:
      SEARCH_ENGINE: atlas
